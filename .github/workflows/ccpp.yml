name: C/C++ CI

on: [push]

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        llvm_version: [15, 18]

    steps:
    - uses: actions/checkout@v1
    - name: add-apt-gcc8
      run:  sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
    - name: apt-get
      run: |
        sudo apt-get install -qq --allow-unauthenticated  g++-9 cmake llvm-${{ matrix.llvm_version }}-dev libedit-dev libreadline-dev
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 90
        dpkg-query -L llvm-${{ matrix.llvm_version }}
    - name: configure
      run: |
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 90
        cmake -DFLOYD_LLVM_APT_VERSION=${{ matrix.llvm_version }} compiler
    - name: make
      run: cmake --build . 
    
  build-mac-cmake:

    runs-on: macos-latest  
    steps:
    - uses: actions/checkout@v1
    - name: Brew install
      run: |
        brew install llvm@18
        brew install cmake
        brew info llvm@18
    - name: configure 
      run: cmake compiler
    - name: make
      run: cmake --build . 

  build-mac-xcode:
    runs-on: macos-latest  
    steps:
    - uses: actions/checkout@v1
    - name: Brew install
      run: |
        brew install llvm@18
        brew install cmake
        sudo mkdir -p /usr/local/Cellar/llvm/ && sudo ln -s "$(brew --prefix llvm@18)" /usr/local/Cellar/llvm/8.0.1
    - name: Creating Application
      run: xcodebuild -scheme distributable build
    - name: floyd Hwcaps
      run: ls /Users/runner/Library/Developer/Xcode/DerivedData &&  cd  /Users/runner/Library/Developer/Xcode/DerivedData/floyd-*/Build/Products/Release;./floyd hwcaps

